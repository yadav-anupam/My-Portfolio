<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login — Anupam Yadav Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #14110E;
      --bg-surface: #1B1714;
      --bg-card: rgba(27, 23, 20, 0.85);
      --border: rgba(224, 174, 110, 0.14);
      --border-focus: #C68A4E;
      --text: #F5EFEB;
      --text-muted: #A3968C;
      --accent-bronze: #C68A4E;
      --accent-gold: #E0AE6E;
      --accent-glow: rgba(198, 138, 78, 0.25);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --font-serif: 'Fraunces', Georgia, serif;
      --font-sans: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(ellipse at top, rgba(198, 138, 78, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse at bottom, rgba(224, 174, 110, 0.06) 0%, transparent 70%),
        var(--bg);
      font-family: var(--font-sans);
      color: var(--text);
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(224, 174, 110, 0.07) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      opacity: 0.6;
    }

    .login-container {
      position: relative;
      z-index: 2;
      width: min(92vw, 420px);
    }

    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2.25rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 1px 1px rgba(224, 174, 110, 0.1);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-bronze), var(--accent-gold), transparent);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: 100px;
      background: rgba(198, 138, 78, 0.1);
      border: 1px solid rgba(198, 138, 78, 0.25);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent-gold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .login-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-gold);
      box-shadow: 0 0 8px var(--accent-gold);
    }

    .login-title {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .status-alert {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.84rem;
      line-height: 1.4;
      margin-bottom: 1.25rem;
      align-items: center;
      gap: 0.6rem;
    }

    .status-alert.error {
      display: flex;
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .status-alert.success {
      display: flex;
      background: var(--success-bg);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #86efac;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      padding: 0.85rem 1rem;
      font-family: var(--font-sans);
      font-size: 0.92rem;
      color: var(--text);
      background: rgba(15, 12, 10, 0.65);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--border-focus);
      background: rgba(20, 17, 14, 0.9);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form-input::placeholder {
      color: #6a6058;
    }

    .btn-submit {
      width: 100%;
      padding: 0.95rem;
      margin-top: 0.5rem;
      background: linear-gradient(135deg, var(--accent-bronze), var(--accent-gold));
      color: #14110E;
      font-family: var(--font-sans);
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 20px rgba(198, 138, 78, 0.3);
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(198, 138, 78, 0.45);
      filter: brightness(1.05);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(20, 17, 14, 0.3);
      border-top-color: #14110E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .btn-submit.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .login-footer {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .login-footer a {
      color: var(--accent-gold);
      text-decoration: none;
      transition: color 0.2s;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-badge">
          <span class="login-badge-dot"></span>
          <span>Control Center Access</span>
        </div>
        <h1 class="login-title">Admin Portal</h1>
        <p class="login-subtitle">Authenticate to manage portfolio content, AI knowledge & system settings.</p>
      </div>

      <div id="statusAlert" class="status-alert" role="alert">
        <span id="alertIcon">⚠️</span>
        <span id="alertText"></span>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="email">Admin Email</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="admin@domain.com"
              required
              autocomplete="email"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="••••••••••••"
              required
              autocomplete="current-password"
            >
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn-submit">
          <span class="spinner" id="btnSpinner" aria-hidden="true"></span>
          <span id="btnText">Sign In to Dashboard</span>
        </button>
      </form>

      <div class="login-footer">
        <a href="index.html">← Return to Public Portfolio</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCQoVoewyuS_WIGSJmVQzW-MThzxyIKvSg",
      authDomain: "anupam-yadav-portfolio.firebaseapp.com",
      projectId: "anupam-yadav-portfolio",
      storageBucket: "anupam-yadav-portfolio.firebasestorage.app",
      messagingSenderId: "46105414968",
      appId: "1:46105414968:web:94a16631d4e852904085cd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const btnText = document.getElementById("btnText");
    const alertBox = document.getElementById("statusAlert");
    const alertText = document.getElementById("alertText");
    const alertIcon = document.getElementById("alertIcon");

    function showAlert(msg, type = "error") {
      alertText.textContent = msg;
      alertBox.className = "status-alert " + type;
      alertIcon.textContent = type === "success" ? "✓" : "⚠️";
      alertBox.style.display = "flex";
    }

    function clearAlert() {
      alertBox.style.display = "none";
      alertBox.className = "status-alert";
    }

    // Check for previous logout message
    const logoutMsg = sessionStorage.getItem("logoutMessage");
    if (logoutMsg) {
      showAlert(logoutMsg, "success");
      sessionStorage.removeItem("logoutMessage");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showAlert("Please enter both email and password.");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.classList.add("loading");
      btnText.textContent = "Authenticating...";

      try {
        await setPersistence(auth, browserSessionPersistence);
        await signInWithEmailAndPassword(auth, email, password);
        sessionStorage.setItem("loginMessage", "Welcome back, Anupam!");
        window.location.href = "admin.html";
      } catch (err) {
        let errorMsg = "Authentication failed. Please verify credentials.";
        if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
          errorMsg = "Invalid email or password. Please try again.";
        } else if (err.code === "auth/too-many-requests") {
          errorMsg = "Access temporarily disabled due to multiple failed attempts. Please try later.";
        } else if (err.message) {
          errorMsg = err.message;
        }
        showAlert(errorMsg, "error");
        loginBtn.disabled = false;
        loginBtn.classList.remove("loading");
        btnText.textContent = "Sign In to Dashboard";
      }
    });
  </script>
</body>
</html>
